monitor = , preferred, auto, 1

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct
env = GTK_THEME,Adwaita:dark

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = yes
        tap-to-click = yes
    }
}

general {
    gaps_in = 5
    gaps_out = 14
    border_size = 2
    col.active_border = rgba(8be9fdff) rgba(bd93f9ff) 45deg
    col.inactive_border = rgba(6272a455)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 14
    active_opacity = 0.96
    inactive_opacity = 0.88
    fullscreen_opacity = 1.0
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.18
    }
    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(00000066)
    }
}

animations {
    enabled = true
    bezier = smooth, 0.22, 1, 0.36, 1
    bezier = snappy, 0.16, 1, 0.3, 1
    animation = windows, 1, 5, smooth, slide
    animation = windowsOut, 1, 4, snappy, popin 80%
    animation = border, 1, 6, smooth
    animation = fade, 1, 5, smooth
    animation = workspaces, 1, 5, smooth, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true
}

exec-once = waybar
exec-once = dunst
exec-once = ~/.config/hypr/scripts/wallpaper.sh --start
exec-once = /usr/lib/polkit-kde-authentication-agent-1

$mainMod = SUPER
$terminal = kitty
$menu = wofi --show drun

bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, D, exec, $menu
bind = $mainMod, E, exec, thunar
bind = $mainMod, B, exec, xdg-open https://www.google.com
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, Q, exit
bind = $mainMod, V, togglefloating
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, P, pseudo
bind = $mainMod, J, togglesplit
bind = $mainMod, L, exec, loginctl lock-session
bind = $mainMod, W, exec, ~/.config/hypr/scripts/wallpaper.sh --pick
bind = $mainMod SHIFT, W, exec, ~/.config/hypr/scripts/wallpaper.sh --random
bind = $mainMod, N, exec, ~/.config/hypr/scripts/wallpaper.sh --next
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod SHIFT, R, exec, hyprctl reload

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
